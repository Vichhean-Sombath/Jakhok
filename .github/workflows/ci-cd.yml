name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-check:
    name: Tracked secret check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_secrets.py

  auth-api:
    name: Auth API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KhmerOCR-Flutter-Working
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/main.dart lib/theme.dart lib/services/firebase_auth_service.dart lib/screens lib/widgets test/widget_test.dart test/ui_responsive_test.dart test/ui_preview_app.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --dart-define=AUTH_API_BASE_URL=https://auth.neuroshift.dev

  python:
    name: Python OCR tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  web-release:
    name: Package Flutter web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KhmerOCR-Flutter-Working
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release without the private OCR key
        env:
          FIREBASE_API_KEY: ${{ secrets.FLUTTER_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FLUTTER_FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FLUTTER_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FLUTTER_FIREBASE_WEB_APP_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FLUTTER_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FLUTTER_FIREBASE_STORAGE_BUCKET }}
        run: |
          flutter build web --release \
            --dart-define=AUTH_API_BASE_URL=https://auth.neuroshift.dev \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"
      - uses: actions/upload-artifact@v4
        with:
          name: netra-web-release
          path: KhmerOCR-Flutter-Working/build/web
          if-no-files-found: error

  deploy-auth-api:
    name: Deploy auth API to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secret-check, auth-api, python, web-release]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: auth-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy auth-api to Vercel
        working-directory: auth-api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.12.1 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Verify the production auth domain
        run: |
          node --input-type=module -e "const response = await fetch('https://auth.neuroshift.dev/api/auth/session/status', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({idToken: 'deployment-health-check'})}); console.log('Auth domain HTTP', response.status); if (![400, 401].includes(response.status)) process.exit(1);"
