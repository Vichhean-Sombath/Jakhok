name: khmer_ocr_flutter
description: Offline-first document scanner with a DeepSeek-inspired interface.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  http: ^1.6.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  flutter_markdown: ^0.7.7+1
  flutter_math_fork: ^0.7.4
  file_picker: ^13.1.0
  syncfusion_flutter_pdf: ^35.1.39
  pdfx: ^2.11.0
  archive: ^4.0.7
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/netra_logo.png
  fonts:
    - family: KhmerOSSiemReap
      fonts:
        - asset: assets/fonts/KhmerOSSiemreap.ttf
