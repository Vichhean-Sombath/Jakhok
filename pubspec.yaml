name: khmer_ocr_flutter
description: Offline-first document scanner with a DeepSeek-inspired interface.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  flutter_markdown: ^0.7.7+1
  file_picker: ^13.1.0
  syncfusion_flutter_pdf: ^35.1.39
  pdfx: ^2.11.0
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
